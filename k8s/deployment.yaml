apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-web-app

  template:
    metadata:
      labels:
        app: kubernetes-web-app

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true

      volumes:
        - name: web-content
          configMap:
            name: web-app-config
